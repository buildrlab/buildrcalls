version: 2
multi-ecosystem-groups:
  all-dependencies:
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Dublin
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
